<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 2: Guess the Number</title>
    <script src="js/script.js" defer></script>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>
        <h1> Guess the Number!</h1>
    </header>
    Guess:
    <!--Creates text box-->
    <input id="userGuess" type="text" size="5">

    <br>
    <button id="guessBtn">Guess!</button>
    <br>
    Guesses:
    <span id="userGuesses"></span>
    <div id="guess"></div>
    <button id="resetBtn" style="display:none;">Reset</button>
    <div id="result"></div>
    <div id="feedback"></div>
    <div>Previous Guesses:</div>
    <span id="guesses"></span>
    <div>Wins: <span id="wins">0</span></div>
    <div>Losses: <span id="losses">0</span></div>
    <img id="gameImage" src="" style="display:none; width:200px; margin-top:20px;">



</body>

</html>
