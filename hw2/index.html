<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Slot Machine</title>
  <script src="js/script.js" defer></script>
  <link rel="stylesheet" href="style.css">
  
</head>
<body>
  <h1>Slot Machine</h1>

  <p>Enter your bet:</p>
  
  <input type="number" id="bet" min="1" value="10">
  <button id="spinButton">Spin</button>
  <button id="resetButton">Reset</button>
  
  <div>
    <img class="slot" id="slot1" src="img/cherries.jpg" alt="">
    <img class="slot" id="slot2" src="img/lemon.jpg" alt="">
    <img class="slot"  id="slot3" src="img/7.jpg" alt="">
  </div>

  <p id="message"></p>
  
  <p>Balance: $<span id="balance">100</span></p>
   <p >Wins: <span id="wins">0</span> | Losses: <span id="losses">0</span></p>

   <div id="result">
    <img id="resultImage" src="" >
</div>
</body>
</html>
